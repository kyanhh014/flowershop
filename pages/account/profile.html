<!doctype html>
<html lang="vi">
<!-- Giải thích cấu trúc trang: Trang cập nhật thông tin cá nhân, mật khẩu và sổ địa chỉ. -->
<head>
  <!-- Phần head khai báo ngôn ngữ, viewport responsive, đường dẫn tài nguyên và script dùng chung. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../">
  <meta name="theme-color" content="#fff7f7">
  <title>Thông tin tài khoản | Hoa Xinh</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script></head>
<body data-page="profile">
  <!-- data-page/data-role/data-feature là metadata để app.js xác định renderer và quyền truy cập của trang. -->
  <div class="page-shell">
    <a class="skip-link" href="#profile-form">Bỏ qua điều hướng</a>
        <!-- Header dùng chung gồm banner thương hiệu; nav có thể tĩnh hoặc được app.js dựng động. -->
<header class="site-header">
      <div class="identity-banner">
        <a class="brand-lockup" href="home.html" aria-label="Hoa Xinh - Trang chủ">
          <img class="brand-reference-image" src="assets/images/header-web-ban-hoa.png" alt="Hoa Xinh - Trao hoa, gửi yêu thương">
        </a>
      </div>
      <nav class="main-nav" aria-label="Điều hướng chính"><div class="nav-inner"></div></nav>
    </header>

    <!-- Trang tài khoản gồm thông tin cá nhân, đổi mật khẩu và sổ địa chỉ. -->
        <!-- Vùng nội dung chính của trang: HTML tạo khung, còn dữ liệu và thao tác thường do app.js bổ sung. -->
<main class="main-content">
      <section class="welcome-copy">
        <p class="eyebrow">TÀI KHOẢN CỦA TÔI</p>
        <h1>Thông tin tài khoản &amp; Sổ địa chỉ</h1>
        <p class="welcome-description">Quản lý thông tin tài khoản và địa chỉ nhận hoa.</p>
      </section>

      <!-- Các card bên dưới được JavaScript nạp dữ liệu theo tài khoản đang đăng nhập. -->
      <div class="profile-layout">
        <section id="customer-stats" class="customer-stats-grid" aria-label="Thống kê mua sắm" hidden></section>
        <section class="login-card profile-card" aria-label="Thông tin cơ bản">
          <h2>Thông tin cá nhân</h2>
          <form id="profile-form">
            <label for="profile-name">Họ tên khách hàng</label>
            <input id="profile-name" name="name" autocomplete="name" required placeholder="Nhập họ và tên...">
            <label for="profile-phone">Số điện thoại liên hệ</label>
            <input id="profile-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="Ví dụ: 0901234562">
            <p id="profile-message" class="login-help" role="status" hidden></p>
            <button class="button button-primary profile-submit" type="submit">Lưu thông tin</button>
          </form>
        </section>
        <section class="login-card profile-card" aria-label="Cập nhật mật khẩu">
          <h2>Cập nhật mật khẩu</h2>
          <form id="password-form">
            <label for="profile-current-password">Mật khẩu hiện tại</label>
            <div class="password-field">
              <input id="profile-current-password" name="currentPassword" type="password" autocomplete="current-password" required>
              <button class="password-toggle" type="button" data-password-toggle="profile-current-password" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <label for="profile-new-password">Mật khẩu mới</label>
            <div class="password-field">
              <input id="profile-new-password" name="newPassword" type="password" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-password-toggle="profile-new-password" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <label for="profile-confirm-password">Xác nhận mật khẩu mới</label>
            <div class="password-field">
              <input id="profile-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-password-toggle="profile-confirm-password" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
            </div>
            <p id="password-message" class="login-help" role="status" hidden></p>
            <button class="button button-primary profile-submit" type="submit">Lưu mật khẩu</button>
          </form>
        </section>
        <section id="address-book-card" class="login-card profile-card address-book-card" aria-label="Sổ địa chỉ giao hàng" hidden>
          <h2>Sổ địa chỉ nhận hàng</h2>
          <div id="address-list" class="address-list"></div>
          <form id="add-address-form" class="add-address-form">
            <label for="new-address-input">Thêm địa chỉ giao hàng mới</label>
            <div class="add-address-input-group">
              <input id="new-address-input" name="newAddress" placeholder="Nhập số nhà, tên đường, phường, quận/huyện..." required>
              <button class="button button-secondary" type="submit">Thêm địa chỉ</button>
            </div>
            <p id="address-message" class="login-help" role="status" hidden></p>
          </form>
        </section>
      </div>
    </main>

        <!-- Footer dùng chung hiển thị nhận diện, giới thiệu và thông tin liên hệ của Hoa Xinh. -->
<footer class="site-footer">
      <div class="footer-inner"><img class="footer-reference-image" src="assets/images/footer-web-ban-hoa.png" alt="Thông tin giới thiệu và liên hệ cửa hàng Hoa Xinh"></div>
      <div class="footer-bottom">© 2026 Hoa Xinh · Demo giao diện cửa hàng hoa</div>
    </footer>
  </div>
</body>
</html>
