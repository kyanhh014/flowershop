<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../">
  <meta name="theme-color" content="#fdf8f8">
  <meta name="description" content="Xác nhận thông tin nhận và đặt hàng tại Hoa Xinh">
  <title>Đặt hàng | Hoa Xinh</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="checkout" data-role="customer">
  <div class="page-shell">
    <a class="skip-link" href="#checkout-view">Bỏ qua điều hướng</a>
    <header class="site-header">
      <div class="identity-banner">
        <a class="brand-lockup" href="home.html" aria-label="Hoa Xinh - Trang chủ">
          <img class="brand-reference-image" src="assets/images/header-web-ban-hoa.png" alt="Hoa Xinh - Trao hoa, gửi yêu thương">
        </a>
      </div>
    </header>
    <main class="main-content checkout-page">
      <h1>Đặt hàng</h1>
      <p id="page-error" class="form-message" role="alert" hidden></p>
      <section id="checkout-view" aria-label="Thông tin đặt hàng"></section>
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <img class="footer-reference-image" src="assets/images/footer-web-ban-hoa.png" alt="Thông tin giới thiệu và liên hệ cửa hàng Hoa Xinh">
      </div>
      <div class="footer-bottom">© 2026 Hoa Xinh · Demo giao diện cửa hàng hoa</div>
    </footer>
  </div>
</body>
</html>
