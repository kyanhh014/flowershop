<!doctype html>
<html lang="vi">
<!-- Giải thích cấu trúc trang: Trang checkout; JavaScript dựng thông tin giao nhận, địa chỉ và thanh toán demo. -->

<head>
  <!-- Phần head khai báo ngôn ngữ, viewport responsive, đường dẫn tài nguyên và script dùng chung. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../">
  <meta name="theme-color" content="#fdf8f8">
  <meta name="description" content="Xác nhận thông tin nhận và đặt hàng tại Hoa Xinh">
  <title>Đặt hàng | Hoa Xinh</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/checkout.css">
  <script src="js/app.js" defer></script>
</head>

<body data-page="checkout" data-role="customer">
  <!-- data-page/data-role/data-feature là metadata để app.js xác định renderer và quyền truy cập của trang. -->
  <div class="page-shell">
    <a class="skip-link" href="#checkout-view">Bỏ qua điều hướng</a>
    <!-- Header dùng chung gồm banner thương hiệu; nav có thể tĩnh hoặc được app.js dựng động. -->
    <header class="site-header">
      <div class="identity-banner">
        <a class="brand-lockup" href="home.html" aria-label="Hoa Xinh - Trang chủ">
          <img class="brand-reference-image" src="assets/images/header-web-ban-hoa.png"
            alt="Hoa Xinh - Trao hoa, gửi yêu thương">
        </a>
      </div>
    </header>
    <!-- JavaScript dựng toàn bộ form checkout và chỉ cho khách hàng đã đăng nhập truy cập. -->
    <!-- Vùng nội dung chính của trang: HTML tạo khung, còn dữ liệu và thao tác thường do app.js bổ sung. -->
    <main class="main-content checkout-page">
      <h1>Đặt hàng</h1>
      <p id="page-error" class="form-message" role="alert" hidden></p>
      <!-- Điểm mount cho thông tin giao hàng, sản phẩm và thanh toán demo. -->
      <!-- Điểm mount riêng của checkout; renderCheckout() dựng form đặt hàng tại đây. -->
      <section id="checkout-view" aria-label="Thông tin đặt hàng"></section>
    </main>
    <!-- Footer dùng chung hiển thị nhận diện, giới thiệu và thông tin liên hệ của Hoa Xinh. -->
    <footer class="site-footer">
      <div class="footer-inner">
        <img class="footer-reference-image" src="assets/images/footer-web-ban-hoa.png"
          alt="Thông tin giới thiệu và liên hệ cửa hàng Hoa Xinh">
      </div>
      <div class="footer-bottom">© 2026 Hoa Xinh · Demo giao diện cửa hàng hoa</div>
    </footer>
  </div>
</body>

</html>
