<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><base href="../../">
  <title>Đăng ký tài khoản | Hoa Xinh</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="register">
  <div class="page-shell">
    <header class="site-header">
      <div class="identity-banner"><a class="brand-lockup" href="index.html"><img class="brand-reference-image" src="assets/images/header-web-ban-hoa.png" alt="Hoa Xinh flower shop header"></a></div>
    </header>
    <main class="main-content">
      <section class="welcome-copy"><h1>Đăng ký tài khoản</h1></section>
      <section class="login-layout"><div class="login-card">
        <h2 class="registration-title">Tạo tài khoản khách hàng</h2>
        <form id="registration-form">
          <label for="register-name">Họ tên</label>
          <input id="register-name" name="name" autocomplete="name" placeholder="Nhập họ tên" required>
          <label for="register-phone">Số điện thoại</label>
          <input id="register-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Nhập số điện thoại" required>
          <p id="registration-message" class="login-help" role="status" hidden></p>
          <button class="button login-button" type="submit">TẠO TÀI KHOẢN</button>
        </form>
        <p class="signup-prompt"><a class="text-action text-action--emphasis" href="index.html">Quay lại đăng nhập</a></p>
        <p class="registration-note">Tài khoản demo chỉ lưu trong trình duyệt này. Mật khẩu dùng chung: hoaxinh123.</p>
      </div></section>
    </main>
    <footer class="site-footer"><div class="footer-inner"><img class="footer-reference-image" src="assets/images/footer-web-ban-hoa.png" alt="Hoa Xinh footer with store contact information"></div><div class="footer-bottom">© 2026 Hoa Xinh · Demo giao diện cửa hàng hoa</div></footer>
  </div>
</body>
</html>
